<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h3 class="mb-4">직원 상태 관리</h3>

            <div class="mb-3">
                <h5>이름: <span id="name"></span></h5>
                <h5>현재 상태: <span id="status" class="badge bg-primary"></span></h5>
            </div>

            <hr>

            <h5 class="mb-3">상태 변경</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-success" onclick="changeStatus('보통')">보통</button>
                <button class="btn btn-warning" onclick="changeStatus('기분 안좋음')">기분 안좋음</button>
                <button class="btn btn-danger" onclick="changeStatus('아파요')">아파요</button>
                <button class="btn btn-dark" onclick="changeStatus('파업중')">파업중</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const payload = JSON.parse(atob(token.split('.')[1]));
        const employeeId = payload.id;

        // 직원 정보 불러오기
        async function loadEmployee() {
            const res = await fetch(`/employee/${employeeId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            document.getElementById('name').textContent = data.name;
            document.getElementById('status').textContent = data.status;
        }

        // 상태 변경
        async function changeStatus(status) {
            const res = await fetch(`/employee/${employeeId}/status`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ status })
            });

            if (res.ok) {
                alert('상태가 변경되었습니다!');
                loadEmployee();
            } else {
                alert('상태 변경에 실패했습니다.');
            }
        }

        loadEmployee();
    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
