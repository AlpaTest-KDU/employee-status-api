<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>로그인</title>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card p-4 shadow" style="width: 400px;">
            <h3 class="text-center mb-4">로그인</h3>

            <div class="mb-3">
                <label class="form-label">이름</label>
                <input type="text" id="name" class="form-control" placeholder="이름을 입력하세요">
            </div>

            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>

            <div class="mb-3">
                <label class="form-label">역할</label>
                <select id="role" class="form-select">
                    <option value="employee">직원</option>
                    <option value="manager">관리자</option>
                </select>
            </div>

            <button class="btn btn-primary w-100" onclick="login()">로그인</button>
        </div>
    </div>

    <script>
        async function login() {
            const name = document.getElementById('name').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const res = await fetch(`/auth/${role}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', role);
                if (role === 'manager') {
                    window.location.href = '/manager';
                } else {
                    window.location.href = '/employee';
                }
            } else {
                alert(data.message);
            }
        }
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js""></script>
</body>
</html>
